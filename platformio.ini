; ==================================================================================================
;  Universal Espresso Pressure & Flow Profiling Controller
;  Primary MCU: ESP32-S3 (ESP32-S3-WROOM-1-N8R8 / N16R8)
;
;  QUICK START
;    pio run                      # compile
;    pio run -t upload            # flash over USB (firmware only - the ledger survives)
;    pio device monitor           # serial console @ 115200
;
;  The web UI is compiled into the firmware (data/index.html -> src/network/web_assets.h), so a
;  firmware flash is all a normal update needs. 'pio run -t uploadfs' is deliberately NOT part of
;  that: it replaces the WHOLE LittleFS partition, which holds the brew ledger (/history), the
;  brew profiles (/profiles) and the controller config (/config.json) - every recorded shot is
;  lost, and the images do not merge. If you really want to push a filesystem image, use
;  './flash.sh --fs', which backs the partition up first and asks before destroying anything.
;
;  N16R8 (16MB flash) users: the 8 MB partition table also works on a 16 MB chip. To use the extra
;  space, set board_upload.flash_size = 16MB and supply your own 16 MB partition table.
; ==================================================================================================

[platformio]
name = smart-brew-mcu
description = Universal Espresso Pressure & Flow Profiling Controller (ESP32-S3)
default_envs = esp32s3

[env:esp32s3]
; Arduino-ESP32 3.3.13 on ESP-IDF 5.5.6. The official PlatformIO espressif32 platform stops at
; Arduino 2.0.17, so the 3.x core comes from the community pioarduino platform, pinned to one release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:tools/gen_web_assets.py
    pre:tools/gen_build_info.py

; --- Flash / PSRAM: N8R8 uses Quad (QIO) flash + Octal (OPI) PSRAM -------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions_8MB.csv
board_build.filesystem = littlefs

; --- USB: native USB CDC is the primary console; UART0 is mirrored so a plain UART cable also works
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_SPEED=921600
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DSB_FW_VERSION="\"1.5.0\""
    ; 0=off 1=error 2=warn 3=info 4=debug 5=verbose
    -DSB_LOG_LEVEL=3
    ; 1=enable bench/jig open-loop endpoints and console commands, 0=production
    -DSB_BENCH=0
    ; The task watchdog timeout is set at runtime in setup() (esp_task_wdt_init). Arduino-ESP32 links
    ; a precompiled IDF, so a -DCONFIG_ESP_TASK_WDT_TIMEOUT_S flag here would have no effect.
    ; Force-include the pin map so every pin stays overridable from the command line
    -include include/pins.h
    ; AsyncTCP runs every HTTP and WebSocket handler at priority 10, above the control task (5),
    ; and by default on either core. A slow handler (the history summary reads 15 LittleFS files)
    ; then held Core 1 for 0.5-0.9 s: the control loop froze, zero-cross pulses went uncounted and
    ; shots stopped with a false "AC lost". Keep it on Core 0 with the radio.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.3.0
    ESP32Async/AsyncTCP@^3.1.0
    bblanchon/ArduinoJson@^6.21.5
    h2zero/NimBLE-Arduino@^2.5.2

; --- Dedicated bench/jig development environment with open-loop and sim endpoints -----------------
[env:esp32s3-bench]
extends = env:esp32s3
build_unflags =
    ${env:esp32s3.build_unflags}
    -DSB_BENCH=0
build_flags =
    ${env:esp32s3.build_flags}
    -DSB_BENCH=1

; --- Native-USB-only test env (some DevKitC-1 clones have no USB bridge) ---------------------------
[env:esp32s3-uart]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -UARDUINO_USB_CDC_ON_BOOT
    -UARDUINO_USB_MODE
    -UARDUINO_USB_SPEED

; --- Manual ROM bootloader upload (no DTR/RTS reset toggling over native USB) --------------------
[env:esp32s3-bootloader]
extends = env:esp32s3
upload_flags =
    --before
    no_reset