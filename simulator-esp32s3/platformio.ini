; ==================================================================================================
;  Hardware-In-The-Loop (HIL) Simulator for Espresso Controller
;  Target MCU: ESP32-S3 (ESP32-S3-DevKitC-1 with octal PSRAM, e.g. N8R8 / N16R8)
;
;  Simulates:
;    1. RobotDyn AC Dimmer Zero-Cross (50Hz / 60Hz mains pulse generator)
;    2. Dimmer PSM gate feedback monitoring (measures duty cycle % from controller)
;    3. 0.5V-4.5V pressure transducer -> post-divider node (0.333 - 3.000 V) via filtered PWM
;    4. Bookoo BLE espresso scale (weight frames @ 33 Hz, tare command reception)
;    5. Virtual brew button feedback & manual barista button toggle
; ==================================================================================================

[platformio]
name = espresso-hardware-simulator
description = ESP32-S3 HIL Test Rig for Smart Brew Controller
default_envs = esp32s3

[env:esp32s3]
; Arduino-ESP32 3.3.13 on ESP-IDF 5.5.6, from the community pioarduino platform (the official
; PlatformIO espressif32 platform stops at Arduino 2.0.17). Pinned to one release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -I../include

lib_deps =
    ; Same NimBLE-Arduino line as the controller and the companion scale, so all three boards
    ; build against one callback and connection-info API.
    h2zero/NimBLE-Arduino@^2.5.2
