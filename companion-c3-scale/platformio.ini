; Companion Custom ESP32-C3 + HX711 Bluetooth Espresso Scale
; See README.md and the parent repository's docs/Hardware.md for the protocol spec.

[env:esp32-c3-devkitm-1]
; Arduino-ESP32 3.3.13 on ESP-IDF 5.5.6, from the community pioarduino platform (the official
; PlatformIO espressif32 platform stops at Arduino 2.0.17). Pinned to one release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions_4MB.csv
board_build.f_cpu = 160000000L

; NimBLE-Arduino 2.x, the same line as the controller and the simulator. It runs
; alongside this project's own ESP-NOW link. No other library is used: the HX711
; driver is bit-banged in-tree and there is no Wire/I2C usage.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2

build_flags =
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=15
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600