; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-3.5B Client Display
; Board: Waveshare ESP32-S3-Touch-LCD-3.5B (ESP32-S3R8, 16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = waveshare_esp32s3_35

[env:waveshare_esp32s3_35]
; Arduino-ESP32 3.3.13 on ESP-IDF 5.5.6, from the community pioarduino platform (the official
; PlatformIO espressif32 platform stops at Arduino 2.0.17). Pinned to one release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 240MHz CPU, 80MHz Quad Flash, 80MHz Octal PSRAM (qio_opi)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_type = release
monitor_filters = esp32_exception_decoder

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; The binary telemetry frame layout is shared with the controller firmware so the two can
    ; never drift apart - one header, two projects.
    -I../include
    -DCORE_DEBUG_LEVEL=1

lib_deps = 
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1

monitor_speed = 115200
upload_speed = 921600
